<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B3F">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Mon Élevage Avicole</title>
<style>
:root{--bg:#F3F6F1;--card:#fff;--ink:#1D2A21;--mute:#5E6B62;--line:#DDE4DB;--g:#2F6B3F;--gsoft:#E1EEE3;--am:#E59F00;--amsoft:#FBF0D2;--red:#B83227;--redsoft:#F9E0DD;--bl:#25679F;--blsoft:#DCEAF6;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#121A15;--card:#1B261F;--ink:#E8EFE9;--mute:#9BAA9F;--line:#2B3A2F;--g:#6FBF84;--gsoft:#22392A;--am:#F2B63A;--amsoft:#3A3015;--red:#F0867C;--redsoft:#3E2321;--bl:#7DB7E6;--blsoft:#1F3345;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top,0px) 0 90px}
main{max-width:520px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:0;font-weight:800}
h2{font-size:18px;margin:22px 0 10px;font-weight:700}
.sub{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.hero{background:var(--g);color:#fff;border-radius:20px;padding:18px}
.hero .sub{color:#DCEBDF}
.big{font-size:32px;font-weight:800;line-height:1.1}
.bar{height:12px;border-radius:6px;background:rgba(255,255,255,.28);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--am)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-size:22px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.n{font-weight:700}
.pill{display:inline-block;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700}
.p-g{background:var(--gsoft);color:var(--g)}.p-a{background:var(--amsoft);color:var(--am)}.p-r{background:var(--redsoft);color:var(--red)}
.alert{border-left:5px solid var(--am);background:var(--amsoft);padding:10px 12px;border-radius:10px;margin-bottom:8px;font-size:15px}
.alert.r{border-color:var(--red);background:var(--redsoft)}
.seg{display:flex;height:10px;border-radius:5px;overflow:hidden;margin-top:8px;background:var(--line)}
.seg i{display:block}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;background:none;border:0;color:var(--mute);font:inherit;font-size:11px;padding:4px 0}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--g);font-weight:800}
.fab{position:fixed;right:16px;bottom:calc(80px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:29px;background:var(--am);color:#1D2A21;border:0;font-size:32px;font-weight:800;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.sheet.open{display:flex}
.sheet>div{background:var(--card);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
select,input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.ok{width:100%;margin-top:16px;padding:14px;border-radius:12px;border:0;background:var(--g);color:#fff;font:inherit;font-weight:800;font-size:17px}
.ghost{width:100%;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:700;text-align:center;display:block;text-decoration:none}
.rep{white-space:pre-wrap;font-size:15px;line-height:1.55}
.note{font-size:13px;color:var(--mute);text-align:center;margin-top:14px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="Ajouter">+</button>
<div class="sheet" id="sheet"><div id="form"></div></div>
<nav id="nav"></nav>
<script src="./app.js" defer></script>
</body>
</html>
